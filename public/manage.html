<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Maison Sillon — Inventory manager</title><link rel="stylesheet" href="manage.css"><header><a href="/">maison sillon ●</a><button id="logout" hidden>Sign out</button></header><main><h1>Manage your CDs</h1><p id="message" role="status"></p><form id="login"><label>Admin password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><section id="manager" hidden><div class="toolbar"><input id="search" type="search" placeholder="Search artists or albums" aria-label="Search artists or albums"><button id="new">Add a CD</button><button id="refresh">Refresh</button></div><p id="count"></p><div id="list"></div></section><dialog id="editor"><form id="edit"><h2 id="editor-title">Edit CD</h2><div id="fields"></div><label>Availability<select name="status"><option value="available">Available</option><option value="sold">Sold</option></select></label><label class="check"><input name="is_hidden" type="checkbox">Hidden from the public catalogue</label><p>Mark sold to keep the red ribbon. Hide to remove the listing from the public catalogue.</p><div class="actions"><button type="button" id="cancel">Cancel</button><button id="save">Save changes</button></div></form></dialog></main><script src="manage.js" defer></script></html>
